application:
  subdomain: echo-noise
  background_task: true
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://echo-noise:1314/
services:
  echo-noise:
    # upstream: noise233/echo-noise:v3.5.5
    image: registry.lazycat.cloud/czyt/noise233/echo-noise:3b77b5dd19ce5051
    environment:
      - LOG_LEVEL=info
      - DB_TYPE=sqlite
      - DB_PATH=/app/data/noise.db
    binds:
      - /lzcapp/var/data:/app/data
    setup_script: |
      if [ ! -f /app/data/noise.db ];then
         cp -r /lzcapp/pkg/content/noise.db /app/data/noise.db
      fi

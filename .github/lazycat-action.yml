version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/echo-noise.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: echo-noise
build:
  run_buildscript: false
images:
  - id: echo-noise
    target: service
    service: echo-noise
    source: noise233/echo-noise
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Echo Noise
    summary: "完善的轻量说说笔记系统及memos的开源替代品"
